syntax = "proto2";

package remote_drive.vehicle;

// 一个允许与车辆通信的驾驶舱 UDP 端点
message UdpEndpoint {
  required string ip = 1;
  required uint32 port = 2;
}

// 单辆车的运行时部署配置，由 Cyber Component 在启动时加载
message RemoteDriveVehicleConfig {
  // 当前车辆的唯一标识和本地 UDP 监听端口
  required string vehicle_id = 1;
  required uint32 local_port = 2;

  // 车辆状态发送目标，同时作为控制包来源白名单
  repeated UdpEndpoint cockpits = 3;

  // 字段 4 曾用于控制 Channel，保留编号避免后续误复用
  reserved 4;

  // 字段 5 曾用于心跳周期，保留编号避免后续误复用
  reserved 5;

  // 车辆状态对外发送周期
  optional uint32 state_interval_ms = 6 [default = 100];
}
